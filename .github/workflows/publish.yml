name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - name: Run tests
        run: just test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io for current version
        id: check
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          name=$(echo "$meta" | jq -r '.packages[0].name')
          version=$(echo "$meta" | jq -r '.packages[0].version')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/${name}/${version}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "already_published=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        if: steps.check.outputs.already_published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Already published, skipping
        if: steps.check.outputs.already_published == 'true'
        run: echo "::notice::v${{ steps.check.outputs.version }} is already on crates.io — bump the version in Cargo.toml to ship a new release."
